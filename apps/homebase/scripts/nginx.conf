server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location ~ /\. { return 404; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri.html $uri/ =404;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control no-cache;
    }
}
